[project]
name = "gsb-bot"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.10,<3",
    "bcrypt>=4.2,<5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.0",
    "openpyxl>=3.1,<4",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
]

[tool.vercel]
entrypoint = "apps.api.app.main:app"
